name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer main push must not cancel or replace a queued quality gate.
  # GitHub keeps only one pending run per concurrency group even if cancellation
  # is disabled; use a unique run ID for non-PR events.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        racket-version: ["9.0", "9.3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: ${{ matrix.racket-version }}
      # Deployment-tested Permit source, not a floating main.
      - name: Checkout pinned Permit source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/turlamai/permit.git "$RUNNER_TEMP/permit-src"
          git -C "$RUNNER_TEMP/permit-src" checkout --detach bba48fd460de6602d1d62afe7644c0ebd2dd62e6
          test "$(git -C "$RUNNER_TEMP/permit-src" rev-parse HEAD)" = "bba48fd460de6602d1d62afe7644c0ebd2dd62e6"
      - name: Install pinned Permit package
        shell: bash
        run: raco pkg install --copy --auto --no-docs --name permit "$RUNNER_TEMP/permit-src"
      - name: Install package
        run: raco pkg install --auto --no-docs --name commerce "${{ github.workspace }}"
      - name: Compile
        run: raco make commerce/main.rkt commerce/provider.rkt commerce/journal.rkt commerce/storage.rkt commerce/storage/sqlite.rkt commerce/pancake.rkt commerce/permit.rkt commerce/issuer.rkt commerce/operator.rkt commerce/health.rkt commerce/log.rkt commerce/server.rkt commerce/private/service-role.rkt commerce-doc/scribblings/commerce.scrbl examples/service.rkt
      - name: Test
        run: raco test -p commerce

  quality:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: "9.3"
      # Deployment-tested Permit source, not a floating main.
      - name: Checkout pinned Permit source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/turlamai/permit.git "$RUNNER_TEMP/permit-src"
          git -C "$RUNNER_TEMP/permit-src" checkout --detach bba48fd460de6602d1d62afe7644c0ebd2dd62e6
          test "$(git -C "$RUNNER_TEMP/permit-src" rev-parse HEAD)" = "bba48fd460de6602d1d62afe7644c0ebd2dd62e6"
      - name: Install pinned Permit package
        shell: bash
        run: raco pkg install --copy --auto --no-docs --name permit "$RUNNER_TEMP/permit-src"
      - name: Install package with documentation
        run: raco pkg install --auto --name commerce "${{ github.workspace }}"
      - name: Check declared package dependencies
        run: raco setup --check-pkg-deps commerce
      - name: Build reference manual
        run: |
          raco scribble ++xref-in setup/xref load-collections-xref \
            --htmls --dest "${{ runner.temp }}/commerce-doc" \
            commerce-doc/scribblings/commerce.scrbl
          test -s "${{ runner.temp }}/commerce-doc/commerce/index.html"
      - name: Run newcomer walkthrough
        run: racket examples/first-purchase.rkt
      - name: Require a clean generated tree
        run: git diff --exit-code


  latest-permit-compatibility:
    # Intentionally floating: proves compatibility, not release reproducibility.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: "9.3"
      - name: Install latest Permit package
        run: raco pkg install --auto --no-docs --name permit https://github.com/turlamai/permit.git
      - name: Install Commerce package
        run: raco pkg install --auto --no-docs --name commerce "${{ github.workspace }}"
      - name: Test latest Permit integration
        run: raco test -p commerce

  docker-build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build service without live secrets
        run: docker build --pull -t commerce-ci -f deploy/Dockerfile .

  split-permissions-preflight:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exercise permission gate using disposable identities and dummy files
        run: |
          set -euo pipefail
          bash -n deploy/check-split-permissions.sh
          sudo groupadd --system commerce-shared
          sudo useradd --system --gid commerce-shared --shell /usr/sbin/nologin commerce-edge
          sudo useradd --system --gid commerce-shared --shell /usr/sbin/nologin commerce-issuer
          work=$(mktemp -d)
          trap 'sudo rm -rf -- "$work"' EXIT
          chmod 755 "$work"
          sudo install -o commerce-issuer -g commerce-shared -m 0600 /dev/null "$work/issuer"
          sudo install -o commerce-edge -g commerce-shared -m 0600 /dev/null "$work/edge"
          sudo install -d -o commerce-edge -g commerce-shared -m 2770 "$work/db"
          sudo bash deploy/check-split-permissions.sh "$work/issuer" "$work/edge" "$work/db"
          sudo chmod 0640 "$work/issuer"
          if sudo bash deploy/check-split-permissions.sh "$work/issuer" "$work/edge" "$work/db"; then
            echo "Unexpected acceptance of readable issuer key"
            exit 1
          fi
          sudo chmod 0600 "$work/issuer"
          sudo chmod 2750 "$work/db"
          if sudo bash deploy/check-split-permissions.sh "$work/issuer" "$work/edge" "$work/db"; then
            echo "Unexpected acceptance of inaccessible shared database directory"
            exit 1
          fi

  permit-release-compatibility:
    # Qualify the exact published archive without changing the deployed pin.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: "9.3"
      - name: Download and verify Permit v0.2.2 source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/permit-release"
          cd "$RUNNER_TEMP/permit-release"
          curl --fail --location --retry 3 --output permit-0.2.2.zip https://github.com/turlamai/permit/releases/download/v0.2.2/permit-0.2.2.zip
          echo '18421486146025d868e73caddcf7ad6f69aa3dfe967d7d8113fe4e37ee643639  permit-0.2.2.zip' | sha256sum -c -
          raco pkg install --copy --auto --batch --no-docs --name permit permit-0.2.2.zip
      - name: Test Commerce with the verified release
        shell: bash
        run: |
          raco pkg install --auto --batch --no-docs --name commerce "$GITHUB_WORKSPACE"
          raco test -p commerce
          raco setup --check-pkg-deps commerce
